# Dagoberd project configuration (no secrets)
# Personal overrides: account-eval.local.toml (gitignored)

[database]
path = "output/account_eval.db"

[comdirect]
# Each connection has a stable name and separate keyring entries.
# [comdirect.connections.private]
# enabled = true
# session_mode = "ephemeral"
# keychain_session_max_age_hours = 12
# allow_mcp_sync = false
# username_secret = "comdirect.private.username"
# client_id_secret = "comdirect.private.client-id"
# client_secret_secret = "comdirect.private.client-secret"

[llm]
enabled = false
mode = "local"
provider = "openai-compatible"
base_url = "http://127.0.0.1:11434/v1"
model = ""
api_key_secret = "ACCOUNT_EVAL_LLM_API_KEY"
allow_cloud = false
timeout_seconds = 30.0
temperature = 0.0
batch_size = 10
max_retries = 2

[privacy]
mask_visible_characters = 4
max_text_length = 500
allow_document_content_for_llm = false

[reporting]
output_dir = "output"
default_formats = ["json", "xlsx", "html"]
base_currency = "EUR"

[documents]
storage_dir = "output/documents"
auto_match_threshold = 0.95
auto_match_minimum_gap = 0.15
extract_pdf_text = true
local_ocr_enabled = false
local_ocr_executable = "tesseract"
local_ocr_pdf_renderer = "pdftoppm"
local_ocr_languages = ["deu", "eng"]
local_ocr_timeout_seconds = 120

[delivery]
enabled = false
host = "localhost"
port = 587
starttls = true
use_ssl = false
from_address = ""
username_secret = "ACCOUNT_EVAL_SMTP_USERNAME"
password_secret = "ACCOUNT_EVAL_SMTP_PASSWORD"
timeout_seconds = 30.0

# Keep local recipients in account-eval.local.toml:
# [delivery.targets.personal]
# recipients = ["name@example.org"]
# subject_prefix = "My finances"
#
# Configure synchronized storage (Google Drive, OneDrive, etc.) in account-eval.local.toml:
# [cloud]
# workspace = "/absolute/path/to/sync/Dagoberd"

[transaction_semantics]
transfer_max_days = 5
transfer_max_fee_minor = 1000
refund_max_days = 90
correction_max_days = 14
minimum_candidate_score = 0.6

[imports]
max_file_size_mib = 50

[agents]
allow_manual_transactions_mcp = false

# Tabular exports: poetry run dagoberd import preview --source tabular --account <id> <file>
