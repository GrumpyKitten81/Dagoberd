[project]
name = "account-eval"
version = "0.3.0b1"
description = "Local agentic finance ledger, classification and reporting"
keywords = ["finance", "ledger", "comdirect", "camt053", "mcp"]
authors = [{name = "GrumpyKitten81"}]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "openai>=2.54.0,<3.0.0",
    "pydantic>=2.14.2,<3.0.0",
    "pandas>=3.1.1,<4.0.0",
    "xlrd>=2.0.1,<3.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "requests>=2.32,<3.0",
    "mcp>=1.30.0,<2.0",
    "keyring>=25,<26",
    "cryptography>=50.0.2,<51",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "tomlkit (>=0.13,<1)",
]

[project.scripts]
account-eval = "account_eval.cli:main"
account-eval-mcp = "account_eval.mcp_server:main"

[project.urls]
Homepage = "https://github.com/GrumpyKitten81/AccountEval"
Issues = "https://github.com/GrumpyKitten81/AccountEval/issues"
Changelog = "https://github.com/GrumpyKitten81/AccountEval/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3.0",
    "pandas-stubs>=3.0.5.260914,<3.1",
    "pre-commit>=4.6.2,<5.0",
    "pytest>=9.0.2,<10.0.0",
    "ruff>=0.15.20,<0.16",
    "types-requests>=2.33.0.20261006,<3.0",
    "httpx (>=0.28.1,<0.29.0)",
    "playwright>=1.63.0,<2.0",
]

[tool.poetry]
requires-poetry = ">=2.2,<3.0"
packages = [
    {include = "account_eval", from = "src"},
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "pdfplumber.*", "xlrd.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
