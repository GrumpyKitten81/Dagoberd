name: Release validation

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "poetry.lock"
      - "src/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "poetry.lock"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke-linux:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'pull_request' &&
        (
          github.actor == 'dependabot[bot]' ||
          startsWith(github.event.pull_request.head.ref, 'dependabot/')
        ) &&
        !contains(github.event.pull_request.labels.*.name, 'ready-for-merge')
      )
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.distribution }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            distribution: sdist
            pattern: "dist/*.tar.gz"
          - os: ubuntu-latest
            python: "3.14"
            distribution: wheel
            pattern: "dist/*.whl"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install release test tooling
        run: python -m pip install "build>=1.3,<2" "pytest>=9,<10" "twine>=6.2,<7"
      - name: Build release artifacts
        run: python -m build
      - name: Validate artifact metadata
        run: python -m twine check dist/*
      - name: Install built artifact
        env:
          DIST_PATTERN: ${{ matrix.pattern }}
        run: >-
          python -c "import glob, os, subprocess, sys;
          artifacts = glob.glob(os.environ['DIST_PATTERN']);
          assert len(artifacts) == 1, artifacts;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--force-reinstall', artifacts[0]])"
      - name: Run installed-package release smoke tests
        env:
          ACCOUNT_EVAL_RELEASE_ARTIFACT: "1"
        run: python -m pytest -q tests/release

  release-smoke-full:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'pull_request' &&
        github.actor != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'dependabot/')
      ) ||
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'ready-for-merge')
      )
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.distribution }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            distribution: sdist
            pattern: "dist/*.tar.gz"
          - os: macos-latest
            python: "3.12"
            distribution: wheel
            pattern: "dist/*.whl"
          - os: windows-latest
            python: "3.12"
            distribution: wheel
            pattern: "dist/*.whl"
          - os: ubuntu-latest
            python: "3.14"
            distribution: wheel
            pattern: "dist/*.whl"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install release test tooling
        run: python -m pip install "build>=1.3,<2" "pytest>=9,<10" "twine>=6.2,<7"
      - name: Build release artifacts
        run: python -m build
      - name: Validate artifact metadata
        run: python -m twine check dist/*
      - name: Install built artifact
        env:
          DIST_PATTERN: ${{ matrix.pattern }}
        run: >-
          python -c "import glob, os, subprocess, sys;
          artifacts = glob.glob(os.environ['DIST_PATTERN']);
          assert len(artifacts) == 1, artifacts;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--force-reinstall', artifacts[0]])"
      - name: Run installed-package release smoke tests
        env:
          ACCOUNT_EVAL_RELEASE_ARTIFACT: "1"
        run: python -m pytest -q tests/release

  windows-unit-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'pull_request' &&
        github.actor != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'dependabot/')
      ) ||
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'ready-for-merge')
      )
    name: windows-latest / Python 3.12 / unit suite
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install "poetry>=2.2,<3.0"
      - name: Install dependencies
        run: poetry sync
      - name: Run full unit test suite
        run: poetry run python -m pytest -q

  gui-browser:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'pull_request' &&
        github.actor != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'dependabot/')
      ) ||
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'ready-for-merge')
      )
    name: ubuntu-latest / Chromium GUI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Poetry
        run: python -m pip install "poetry>=2.2,<3.0"
      - name: Install dependencies
        run: poetry sync
      - name: Install Chromium
        run: poetry run playwright install --with-deps chromium
      - name: Run GUI browser tests
        env:
          ACCOUNT_EVAL_BROWSER_TESTS: "1"
        run: poetry run python -m pytest -q tests/browser
