name: Publish release assets

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and inspect
        run: >-
          python -m pip install "build>=1.3,<2" "twine>=6.2,<7"
          "cyclonedx-bom>=6,<7" &&
          python -m build &&
          python -m twine check dist/* &&
          python -m pip install dist/*.whl &&
          cyclonedx-py environment --output-file dist/dagoberd.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*.whl"
          sbom-path: "dist/dagoberd.cdx.json"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*"
      - name: Attach artifacts and SBOM to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
