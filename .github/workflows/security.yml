name: Release security

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/security.yml"
      - "poetry.lock"
      - "pyproject.toml"
      - "src/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/security.yml"
      - "poetry.lock"
      - "pyproject.toml"
      - "src/**"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "poetry>=2.2,<3" "poetry-plugin-export>=1.9,<2" "pip-audit>=2.9,<3" "detect-secrets>=1.5,<2"
      - name: Scan tracked release sources for secrets
        run: >-
          git ls-files -z |
          xargs -0 detect-secrets-hook --baseline .secrets.baseline
          --exclude-files '(^|/)(tests|doc|dist|poetry.lock)'
      - run: poetry export --format requirements.txt --without-hashes --output /tmp/account-eval-requirements.txt
      - run: python -m pip_audit --requirement /tmp/account-eval-requirements.txt

  # CodeQL removed: requires GitHub Actions API access and/or Code Scanning.
  # dependency-audit covers secrets scanning and pip-audit for release deps.
