name: Feature request
description: Suggest an improvement.
body:
- type: markdown
  attributes:
    value: All issues are public. Do not post credentials, PINs, TANs, tokens, account identifiers, real
      bank exports, receipts, databases or reports. Use synthetic examples and sanitized diagnostics.
- type: textarea
  id: problem
  attributes:
    label: Problem or use case
    description: Describe the need without personal or financial data.
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposed behavior
    description: Explain the intended user-visible result.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives considered
    description: Describe alternatives or write None.
  validations:
    required: true
- type: checkboxes
  id: privacy
  attributes:
    label: Privacy check
    options:
    - label: I checked this report and included no credentials, personal data or real financial files.
      required: true
