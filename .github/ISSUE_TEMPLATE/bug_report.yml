name: Bug report
description: Report a reproducible problem.
body:
- type: markdown
  attributes:
    value: All issues are public. Do not post credentials, PINs, TANs, tokens, account identifiers, real
      bank exports, receipts, databases or reports. Use synthetic examples and sanitized diagnostics.
- type: textarea
  id: version
  attributes:
    label: AccountEval version and installation method
    description: Include the version and whether you installed a wheel, sdist or source checkout.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Operating system and runtime
    description: Include OS, Python and Poetry versions where applicable.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: Use synthetic inputs and sanitized commands. Do not attach bank exports or financial
      files.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    description: Describe the expected result.
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior and sanitized diagnostics
    description: Include only sanitized error codes or messages. Remove identities, paths and financial
      details.
  validations:
    required: true
- type: checkboxes
  id: privacy
  attributes:
    label: Privacy check
    options:
    - label: I checked this report and included no credentials, personal data or real financial files.
      required: true
