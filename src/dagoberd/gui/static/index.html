<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dagoberd</title>
    <link rel="stylesheet" href="__DAGOBERD_ASSETS__/design/tokens.css" />
    <link rel="stylesheet" href="__DAGOBERD_ASSETS__/design/components.css" />
    <link rel="stylesheet" href="__DAGOBERD_ASSETS__/app.css" />
    <link rel="stylesheet" href="__DAGOBERD_ASSETS__/dashboard.css" />
    <link rel="stylesheet" href="__DAGOBERD_ASSETS__/grid.css" />
    <link rel="stylesheet" href="__DAGOBERD_ASSETS__/workspace-management.css" />
  </head>
  <body>
    <header class="app-header">
      <strong class="brand">Dagoberd</strong>
      <button id="account-scope" class="scope-button" type="button" data-i18n="ui.all_accounts">All accounts</button>
      <button id="refresh" class="icon-button" type="button" title="Refresh view" data-i18n-title="ui.refresh_view" aria-label="Refresh view" data-i18n-aria-label="ui.refresh_view">↻</button>
      <label for="language" data-i18n="language.label">Language</label>
      <select id="language" aria-label="Language"></select>
      <nav>
        <button type="button" data-tab="overview" data-i18n="ui.overview">Overview</button>
        <button type="button" data-tab="transactions" data-i18n="ui.transactions">Transactions</button>
        <button type="button" data-tab="admin" data-i18n="ui.administration">Administration</button>
        <button type="button" data-tab="data" data-i18n="ui.data">Data</button>
        <button type="button" data-tab="classification" data-i18n="ui.classification">Classification</button>
      </nav>
    </header>
    <div id="notice" hidden></div>
    <main id="app"></main>
    <section id="boot-error" role="alert" hidden>
      <strong data-i18n="ui.the_interface_could_not_be_started">The interface could not be started.</strong>
      <span id="boot-error-detail" data-i18n="ui.a_required_module_could_not_be_loaded">A required module could not be loaded.</span>
      <button type="button" onclick="location.reload()" data-i18n="ui.reload">Reload</button>
    </section>
    <datalist id="tag-options"></datalist>
    <datalist id="merchant-options"></datalist>
    <script type="module">
      import('__DAGOBERD_ASSETS__/app.js').catch((error) => {
        console.error('Dagoberd GUI boot failed', error);
        document.querySelector('#app').replaceChildren();
        document.querySelector('#boot-error-detail').textContent =
          'The loaded files do not match. Reload the page or restart the GUI.';
        document.querySelector('#boot-error').hidden = false;
      });
    </script>
  </body>
</html>
